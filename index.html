<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costume Contest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap single">
  <header>
    <span class="eyebrow">Halloween · Best Costume</span>
    <h1>The Costume Contest</h1>
    <p class="lede">Tell us who you are, then vote for the best costume. You get one vote, and you can move it until judging ends.</p>
    <div class="status" id="status">Connecting to the ballot box…</div>
  </header>

  <form class="panel voter" id="voter-form" autocomplete="off">
    <label for="v-name">Your name
      <input id="v-name" maxlength="60" required placeholder="e.g. Gomez A.">
    </label>
    <button class="btn" type="submit" id="v-save">Start voting</button>
  </form>
  <div class="panel voter" id="voter-set" hidden>
    <span class="who-now">Voting as <b id="v-show"></b></span>
    <button class="linkish" type="button" id="v-change">Change name</button>
  </div>

  <section>
    <div class="board-head">
      <h2>The lineup</h2>
      <span class="meta" id="meta"></span>
    </div>
    <div class="grid" id="grid">
      <div class="empty" style="grid-column: 1 / -1">
        <strong>No costumes yet</strong>
        <span>Costumes show up here as people enter the contest.</span>
      </div>
    </div>
  </section>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const setStatus = (t, warn) => { $("status").textContent = t; $("status").classList.toggle("warn", !!warn); };
  const store = { get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

  const cfg = window.CONTEST_CONFIG || {};
  if (!window.supabase || !cfg.supabaseUrl || cfg.supabaseUrl.includes("YOUR-PROJECT")) {
    setStatus("Setup needed: add your Supabase URL and key to config.js.", true); return;
  }
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  let uid = null, signedIn = false, voterName = store.get("voterName");
  let entries = [];
  const votes = new Map();   // voter_id -> entry_id
  let busy = false;

  try {
    const { data: s } = await sb.auth.getSession();
    if (s.session) uid = s.session.user.id;
    else { const { data, error } = await sb.auth.signInAnonymously(); if (error) throw error; uid = data.user.id; }
    signedIn = true;
  } catch (e) {
    setStatus("Voting is off: turn on anonymous sign-ins in Supabase (Authentication → Providers).", true);
  }

  function showVoter() {
    const has = !!voterName;
    $("voter-form").hidden = has;
    $("voter-set").hidden = !has;
    $("v-show").textContent = voterName;
    if (!has) $("v-name").value = "";
  }
  showVoter();

  $("voter-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const n = $("v-name").value.trim();
    if (!n) return;
    voterName = n; store.set("voterName", n); showVoter(); render();
    // If they already voted, keep the name on their vote up to date.
    if (signedIn && votes.has(uid)) await sb.from("votes").update({ voter_name: n }).eq("voter_id", uid);
  });
  $("v-change").onclick = () => { $("voter-form").hidden = false; $("voter-set").hidden = true; $("v-name").value = voterName; $("v-name").focus(); };

  async function loadAll() {
    const [en, vo] = await Promise.all([
      sb.from("entries").select("id,name,costume,description,created_at"),
      sb.from("votes").select("voter_id,entry_id"),
    ]);
    if (en.error || vo.error) { setStatus("Couldn't load the lineup. Check the Supabase setup and reload.", true); return; }
    entries = en.data;
    votes.clear(); vo.data.forEach(v => votes.set(v.voter_id, v.entry_id));
    if (signedIn && $("status").textContent.startsWith("Connecting")) setStatus("");
    render();
  }

  let t = null;
  const refresh = () => { clearTimeout(t); t = setTimeout(loadAll, 150); };
  sb.channel("contest")
    .on("postgres_changes", { event: "*", schema: "public", table: "entries" }, refresh)
    .on("postgres_changes", { event: "*", schema: "public", table: "votes" }, refresh)
    .subscribe();
  setInterval(loadAll, 20000);
  await loadAll();

  function render() {
    const myVote = uid ? votes.get(uid) : null;
    const ts = (e) => Date.parse(e.created_at) || 0;
    const list = [...entries].sort((a, b) => ts(a) - ts(b));
    $("meta").textContent = list.length ? `${list.length} ${list.length === 1 ? "costume" : "costumes"}` : "";

    const grid = $("grid"); grid.replaceChildren();
    if (!list.length) {
      const e = document.createElement("div"); e.className = "empty"; e.style.gridColumn = "1 / -1";
      e.innerHTML = "<strong>No costumes yet</strong><span>Costumes show up here as people enter the contest.</span>";
      grid.appendChild(e); return;
    }
    list.forEach((en, i) => {
      const mine = myVote === en.id;
      const tag = document.createElement("article");
      tag.className = "tag" + (mine ? " mine-vote" : "");
      tag.innerHTML = '<div class="tag-top"><span class="num"></span></div><h3 class="costume"></h3><div class="who">worn by <b></b></div>';
      tag.querySelector(".num").textContent = "No. " + String(i + 1).padStart(2, "0");
      tag.querySelector(".costume").textContent = en.costume;
      tag.querySelector(".who b").textContent = en.name;
      if (en.description) { const d = document.createElement("p"); d.className = "desc"; d.textContent = en.description; tag.appendChild(d); }

      const row = document.createElement("div"); row.className = "tally-row"; row.style.justifyContent = "flex-end";
      const btn = document.createElement("button"); btn.type = "button";
      btn.className = "vote" + (mine ? " on" : "");
      btn.textContent = mine ? "Your vote ✓" : (myVote ? "Move vote here" : "Vote");
      btn.disabled = !signedIn || busy;
      btn.setAttribute("aria-pressed", mine ? "true" : "false");
      btn.onclick = () => castVote(mine ? null : en.id);
      row.appendChild(btn); tag.appendChild(row);
      grid.appendChild(tag);
    });
  }

  async function castVote(entryId) {
    if (!uid || busy) return;
    if (!voterName) {
      setStatus("Enter your name first so everyone can see who voted for whom.", true);
      $("v-name").focus(); return;
    }
    busy = true; render();
    const { error } = entryId
      ? await sb.from("votes").upsert({ voter_id: uid, entry_id: entryId, voter_name: voterName, updated_at: new Date().toISOString() })
      : await sb.from("votes").delete().eq("voter_id", uid);
    setStatus(error ? "Couldn't save your vote. Try again in a moment." : (entryId ? "Vote saved." : "Vote withdrawn."), !!error);
    busy = false;
    await loadAll();
  }
})();
</script>
</body>
</html>
